[project]
name = "kokoro-tts"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro>=0.9.2",
    "misaki[ja]",
    "soundfile",
    "numpy",
    "torch",
    # kokoro's English G2P fetches a spaCy model via pip at first run; uv venvs have no pip by default
    "pip",
]

# CPU-only torch: much smaller image, and Docker on macOS can't use the Mac GPU anyway
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true